<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#141b2e"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4de3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4de3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a06bff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4de3ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4de3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5a8a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cursorFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d6ff"/>
    </linearGradient>
    <radialGradient id="rec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="100%" stop-color="#c92c2c"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <circle cx="950" cy="90" r="220" fill="url(#glowCyan)"/>
  <circle cx="1080" cy="290" r="180" fill="url(#glowPurple)"/>

  <!-- subtle grid -->
  <g stroke="#2a3550" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
  </g>

  <!-- recorded mouse path -->
  <path d="M 720 260 C 800 200, 780 120, 860 100 S 980 180, 1020 90"
        fill="none" stroke="url(#trail)" stroke-width="3" stroke-dasharray="8 7" opacity="0.9"/>

  <!-- click ripple points along path -->
  <g>
    <circle cx="720" cy="260" r="10" fill="none" stroke="#4de3ff" stroke-width="2" opacity="0.7"/>
    <circle cx="720" cy="260" r="4" fill="#4de3ff"/>

    <circle cx="860" cy="100" r="14" fill="none" stroke="#a06bff" stroke-width="2" opacity="0.6"/>
    <circle cx="860" cy="100" r="4" fill="#a06bff"/>

    <circle cx="1020" cy="90" r="10" fill="none" stroke="#ff5a8a" stroke-width="2" opacity="0.7"/>
    <circle cx="1020" cy="90" r="4" fill="#ff5a8a"/>
  </g>

  <!-- big cursor arrow at path end -->
  <g transform="translate(1015,80) rotate(-15)">
    <polygon points="0,0 0,34 8,26 14,40 20,37 14,23 24,23"
             fill="url(#cursorFill)" stroke="#0d1117" stroke-width="1.5"/>
  </g>

  <!-- small cursor at path start -->
  <g transform="translate(715,250) rotate(10)">
    <polygon points="0,0 0,24 6,18 10,28 14,26 10,16 17,16"
             fill="url(#cursorFill)" stroke="#0d1117" stroke-width="1.2" opacity="0.85"/>
  </g>

  <!-- recording indicator -->
  <g>
    <circle cx="90" cy="66" r="9" fill="url(#rec)"/>
    <circle cx="90" cy="66" r="15" fill="none" stroke="#ff5a5a" stroke-width="1.5" opacity="0.5"/>
    <text x="112" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#ff8080" letter-spacing="2">REC</text>
  </g>

  <!-- headline -->
  <text x="60" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="76" font-weight="700" fill="#f2f6ff" textLength="620" lengthAdjust="spacingAndGlyphs">
    Mouse Recorder
  </text>

  <!-- tagline -->
  <text x="60" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#9fb0d0" textLength="900" lengthAdjust="spacingAndGlyphs">
    Records and replays precise mouse movements and clicks
  </text>
  <text x="60" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#9fb0d0" textLength="560" lengthAdjust="spacingAndGlyphs">
    for automation and testing workflows.
  </text>

  <!-- baseline accent -->
  <rect x="60" y="292" width="140" height="4" fill="#4de3ff" opacity="0.8"/>
  <rect x="205" y="292" width="60" height="4" fill="#a06bff" opacity="0.8"/>
  <rect x="270" y="292" width="30" height="4" fill="#ff5a8a" opacity="0.8"/>
</svg>